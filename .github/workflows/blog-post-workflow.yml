name: All recent posts
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: sarisia/actions-readme-feed@v1
        id: feed
        with:
          file: 'README.md'
          format: '- ${day} ${monthlong} - [${title}](${url})'
          timezone: 'Europe/London'
          url: |
            https://warrenwoodhouse.blogspot.com/feeds/posts/default
            https://warrenwoodhouse.blogspot.com/feeds/posts/default/-/gaming?alt=rss
            https://www.youtube.com/feeds/videos.xml?playlist_id=PLdSVyIXfBubJTFPpUsp3AsHGtcChwWDK7
            http://feeds.feedburner.com/youtube/warrenwoodhouse
      - if: ${{ steps.feed.outputs.changed == true }}
        uses: sarisia/actions-commit@master
